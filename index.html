<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo Imperial Expandido: A Máquina de Guerra</title>
    <style>
        :root {
            --sith-red: #ff0033;
            --dark-bg: #050507;
            --panel-bg: rgba(21, 22, 26, 0.9);
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --imperial-gray: #2d3139;
        }

        body {
            background-color: var(--dark-bg);
            background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?auto=format&fit=crop&w=1920&q=80');
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-light);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            margin: 0;
            padding: 0;
        }

        /* Navegação Fixa */
        nav {
            background-color: rgba(5, 5, 7, 0.95);
            border-bottom: 2px solid var(--sith-red);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(255, 0, 51, 0.2);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 15px;
            flex-wrap: wrap;
        }

        nav li {
            margin: 0 15px;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--sith-red);
        }

        /* Cabeçalho */
        header {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(5, 5, 7, 0.95)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80') center/cover;
            padding: 160px 20px 80px 20px;
            text-align: center;
            border-bottom: 1px solid #222;
        }

        header h1 {
            color: var(--sith-red);
            font-size: 3.8rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 15px rgba(255, 0, 51, 0.6);
        }

        header p {
            font-size: 1.3rem;
            color: var(--text-muted);
            max-width: 800px;
            margin: 15px auto 0 auto;
        }

        /* Container Principal */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
